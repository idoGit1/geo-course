apiVersion: apps/v1
kind: Deployment
metadata:
  name: geo-course
  namespace: maya-geo
  labels:
    app: geo-course
spec:
  replicas: 3
  selector:
    matchLabels:
      app: geo-course
  template:
    metadata:
      labels:
        app: geo-course
    spec:
      containers:
        - name: geo-course
          image: ghcr.io/idoGit1/geo-course:${IMAGE_TAG}
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: geo-course-service
  namespace: maya-geo
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: geo-course
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: geo-course-ingress
  namespace: maya-geo
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - app.84.13.64.198.sslip.io
      secretName: geo-course-tls
  rules:
    - host: app.84.13.64.198.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: geo-course-service
                port:
                  number: 80
